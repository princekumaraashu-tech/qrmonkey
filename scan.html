<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan QR - QR Monkey</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script type="module" src="/mobile.js"></script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .scan-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .scan-card {
            width: 100%;
            max-width: 560px;
            position: relative;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255,255,255,0.04) inset;
            overflow: hidden;
            animation: cardEntry 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEntry {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Top accent bar */
        .scan-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #10b981, #059669, #047857);
            z-index: 10;
        }

        .scan-card-inner {
            padding: 2.5rem 2rem;
            text-align: center;
        }

        .scan-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .scan-title i {
            color: #10b981;
        }

        .scan-subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.6;
            max-width: 380px;
            margin: 0 auto 1.5rem;
        }

        /* html5-qrcode UI Overrides */
        #reader {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1) !important;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        
        #reader__dashboard_section_csr button,
        #reader__dashboard_section_swaplink {
            background: linear-gradient(135deg, var(--primary), #4f46e5) !important;
            border: none !important;
            padding: 10px 20px !important;
            border-radius: 12px !important;
            color: white !important;
            cursor: pointer !important;
            font-family: 'Outfit', sans-serif !important;
            font-weight: 600 !important;
            margin: 10px !important;
            text-decoration: none !important;
            transition: all 0.3s ease !important;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3) !important;
        }
        
        #reader__dashboard_section_csr button:hover,
        #reader__dashboard_section_swaplink:hover {
            transform: translateY(-2px) !important;
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4) !important;
        }

        #reader__dashboard_section_csr span { 
            color: var(--text-muted) !important; 
            font-family: 'Outfit', sans-serif !important;
        }
        
        #reader a { 
            color: var(--primary) !important; 
            font-weight: 500;
        }
        
        #reader__camera_selection {
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-family: 'Outfit', sans-serif;
            outline: none;
            width: 80%;
            max-width: 300px;
        }
        
        #reader__camera_selection:focus {
            border-color: var(--primary);
        }
        
        #reader video {
            border-radius: 0 0 16px 16px;
            object-fit: cover;
        }
        
        #reader__dashboard_section_swaplink {
            display: inline-block;
            margin-bottom: 15px !important;
        }

        /* Scan Result Panel */
        .scan-result-panel {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            margin-top: 1.5rem;
            display: none;
            animation: fadeIn 0.4s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .success-icon-wrap {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            color: #10b981;
            font-size: 2rem;
            border: 2px solid rgba(16, 185, 129, 0.3);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
        }

        .scan-result-text {
            word-break: break-all;
            margin: 1.5rem 0;
            font-size: 1.1rem;
            color: var(--text-main);
            background: rgba(0,0,0,0.3);
            padding: 1.25rem;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            font-weight: 500;
        }
        
        .result-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }
        
        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            border: none;
        }
        
        .btn-copy {
            background: rgba(255,255,255,0.08);
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .btn-copy:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }
        
        .btn-open {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        
        .btn-open:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }
        
        .scan-again-btn {
            width: 100%;
            margin-top: 1.5rem;
            background: transparent;
            color: var(--text-muted);
            border: 1px dashed rgba(255,255,255,0.2);
        }
        
        .scan-again-btn:hover {
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            border-color: rgba(255,255,255,0.4);
        }

        /* Footer branding */
        .view-footer {
            text-align: center;
            padding: 2rem 1rem;
            font-size: 0.75rem;
            color: rgba(148, 163, 184, 0.5);
        }

        .view-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        
        /* Specific overrides to hide html5-qrcode's ugly borders */
        #reader { border: none !important; }
        #reader__scan_region { background: rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <!-- Top Navbar -->
    <nav class="top-nav">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="/logo.png" alt="QR Monkey" class="nav-logo-img">
                <h2>QR <span>Monkey</span></h2>
            </div>
            <div style="display: flex; gap: 0.75rem;">
                <a href="/index.html" class="nav-btn btn-primary" style="text-decoration: none;">Create QR</a>
            </div>
        </div>
    </nav>

    <main class="scan-main">
        <div class="scan-card">
            <div class="scan-card-inner">
                <h2 class="scan-title"><i class="ph-bold ph-scan"></i> Scan QR Code</h2>
                <p class="scan-subtitle">Use your camera or upload an image to scan and view the contents.</p>

                <div id="reader-container" style="position:relative; width: 100%; max-width: 400px; margin: 0 auto; overflow: hidden; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); background: #000;">
                    <video id="qr-video" style="width: 100%; height: auto; min-height: 250px; object-fit: cover; display: block;"></video>
                    <div style="position: absolute; bottom: 15px; width: 100%; text-align: center; z-index: 10;">
                        <label class="action-btn" style="cursor: pointer; display: inline-flex; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.2); color: white;">
                            <i class="ph ph-image"></i> Upload Image
                            <input type="file" id="file-input" accept="image/*" style="display: none;">
                        </label>
                    </div>
                </div>
                
                <div id="scan-result" class="scan-result-panel">
                    <div class="success-icon-wrap">
                        <i class="ph-bold ph-check"></i>
                    </div>
                    <h3 style="color: #10b981; margin-bottom: 0.5rem;">Scan Successful!</h3>
                    
                    <div class="scan-result-text" id="result-text"></div>
                    
                    <div class="result-actions">
                        <button id="copy-btn" class="action-btn btn-copy">
                            <i class="ph ph-copy"></i> Copy Text
                        </button>
                        <a id="open-link-btn" href="#" target="_blank" class="action-btn btn-open" style="display: none;">
                            <span>Open Link</span> <i class="ph ph-arrow-square-out"></i>
                        </a>
                    </div>
                    
                    <button id="scan-again-btn" class="action-btn scan-again-btn">
                        <i class="ph ph-arrow-clockwise"></i> Scan Another QR
                    </button>
                </div>
            </div>
        </div>
    </main>

    <div class="view-footer">
        Powered by <a href="/index.html">QR Monkey</a> — Secure QR Code Generator
    </div>

    <script type="module" src="/scan.js"></script>
</body>
</html>
