<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - QR Monkey</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7715469242530281"
   crossorigin="anonymous"></script>
  <link rel="icon" type="image/png" href="/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --secondary: #3b82f6;
      --glass-bg: rgba(15, 23, 42, 0.6);
      --glass-border: rgba(255, 255, 255, 0.08);
      --error: #ef4444;
      --success: #10b981;
    }

    body {
      margin: 0;
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* Blob Animation */
    .blob {
      position: absolute;
      filter: blur(80px);
      z-index: -1;
      opacity: 0.6;
      animation: float 10s infinite ease-in-out alternate;
    }

    .blob-1 {
      top: -10%;
      left: -10%;
      width: 40vw;
      height: 40vw;
      background: radial-gradient(circle, rgba(99,102,241,0.4) 0%, rgba(15,23,42,0) 70%);
    }

    .blob-2 {
      bottom: -10%;
      right: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(59,130,246,0.3) 0%, rgba(15,23,42,0) 70%);
      animation-delay: -5s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(5%, 5%) scale(1.1); }
    }

    /* Navbar */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2rem;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.5rem 1.25rem;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.3s;
    }

    .nav-btn:hover {
      background: var(--primary-hover);
    }

    /* Main Container */
    .container {
      max-width: 1200px;
      margin: 3rem auto;
      padding: 0 2rem;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 3rem;
      flex: 1;
    }

    @media (max-width: 800px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .hero {
      grid-column: 1 / -1;
      text-align: center;
      margin-bottom: 2rem;
    }

    .hero h1 {
      font-size: 3rem;
      margin: 0 0 0.5rem 0;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .glass-panel {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 2.5rem;
      backdrop-filter: blur(16px);
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 0.8rem 1rem;
      color: var(--text-main);
      font-family: inherit;
      font-size: 1rem;
      transition: border-color 0.3s, background 0.3s;
      box-sizing: border-box;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.1);
    }

    .input-with-icon .form-control {
      padding-left: 2.8rem;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      top: 2.5rem;
      color: var(--text-muted);
      font-size: 1.2rem;
    }
    
    select.form-control option {
      background: var(--bg-color);
      color: var(--text-main);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 120px;
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 1rem;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 600;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.3s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* Loading Spinner */
    .spinner {
      display: none;
      width: 1.2rem;
      height: 1.2rem;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn-submit.loading .spinner {
      display: inline-block;
    }

    .btn-submit.loading .btn-text {
      display: none;
    }

    /* Success Message */
    .success-msg {
      display: none;
      text-align: center;
      padding: 3rem 1rem;
    }

    .success-msg i {
      font-size: 4rem;
      color: var(--success);
      margin-bottom: 1rem;
    }

    /* Sidebar Styles */
    .sidebar h3 {
      margin-top: 0;
      margin-bottom: 1.5rem;
      font-size: 1.2rem;
    }

    .info-list {
      list-style: none;
      padding: 0;
      margin: 0 0 2rem 0;
    }

    .info-list li {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      color: var(--text-muted);
    }

    .info-list i {
      color: var(--primary);
      font-size: 1.25rem;
    }

    .sidebar-links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .sidebar-links a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.3s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .sidebar-links a:hover {
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <nav>
    <a href="/index.html" class="logo">
      <i class="ph ph-qr-code"></i>
      QR Monkey
    </a>
    <a href="/index.html" class="nav-btn">Create QR</a>
  </nav>

  <div class="container">
    <div class="hero">
      <h1>Contact Us</h1>
      <p>We'd love to hear from you. Get in touch with our team.</p>
    </div>

    <div class="glass-panel form-container">
      <form id="contactForm">
        <div class="form-group input-with-icon">
          <label for="email">Email Address</label>
          <i class="ph ph-envelope input-icon"></i>
          <input type="email" id="email" class="form-control" required placeholder="your@email.com">
        </div>

        <div class="form-group">
          <label for="subject">Reason for Contact</label>
          <select id="subject" class="form-control" required>
            <option value="" disabled selected>Select a topic...</option>
            <option value="General Inquiry">General Inquiry</option>
            <option value="Refund Request">Refund Request</option>
            <option value="Bug Report">Bug Report</option>
            <option value="Feature Request">Feature Request</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" class="form-control" required minlength="20" placeholder="Describe your query in detail..."></textarea>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
          <span class="btn-text">Send Message</span>
          <div class="spinner"></div>
        </button>
      </form>

      <div id="successMessage" class="success-msg">
        <i class="ph-fill ph-check-circle"></i>
        <h2>Thank you!</h2>
        <p>We will respond within 4 working days.</p>
      </div>
    </div>

    <div class="glass-panel sidebar">
      <h3>Contact Information</h3>
      <ul class="info-list">
        <li>
          <i class="ph ph-clock"></i>
          Response time: Within 4 working days
        </li>
        <li>
          <i class="ph ph-envelope-simple"></i>
          support@qrmonkey.com
        </li>
      </ul>

      <h3>Helpful Links</h3>
      <div class="sidebar-links">
        <a href="/terms.html"><i class="ph ph-file-text"></i> Terms of Service</a>
        <a href="/privacy.html"><i class="ph ph-shield-check"></i> Privacy Policy</a>
        <a href="/refund.html"><i class="ph ph-arrow-u-down-left"></i> Refund Policy</a>
      </div>
    </div>
  </div>

  <script type="module" src="/contact.js"></script>
  <script type="module" src="/route-handler.js"></script>
</body>
</html>
